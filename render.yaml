# Render Blueprint — African Real Estate Platform Backend API
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: african-realestate-api
    region: frankfurt
    plan: free
    rootDir: services/api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: MONGODB_URI
      - key: JWT_SECRET
      - key: CLOUDINARY_CLOUD_NAME
        value: deggbzykd
      - key: CLOUDINARY_API_KEY
        value: "951539655157196"
      - key: CLOUDINARY_API_SECRET
      - key: CORS_ORIGINS
        value: https://african-realestate-platform.vercel.app
      - key: AI_API_ENDPOINT
        value: https://api.example.com/v1